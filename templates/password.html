<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password — xsukax</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🔑</div>
    <h1><span class="brand">xsukax</span> — Change password</h1>
  </header>

  <nav>
    <a href="{{ url_for('index') }}">⚙ Generator</a>
    <a href="{{ url_for('models_page') }}">🌐 Translation models</a>
    <a href="{{ url_for('change_password') }}" class="active">🔑 Change password</a>
    <a href="{{ url_for('logout') }}">⏻ Logout</a>
  </nav>

  {% if error %}<div class="errors">{{ error }}</div>{% endif %}
  {% if success %}<div class="success">✔ {{ success }}</div>{% endif %}

  <div class="panel">
    <form method="post" action="{{ url_for('change_password') }}">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password"
             required autocomplete="current-password" style="margin-bottom: .9rem;">

      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password"
             required autocomplete="new-password" minlength="4" style="margin-bottom: .9rem;">

      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             required autocomplete="new-password" minlength="4" style="margin-bottom: 1.2rem;">

      <button type="submit" class="btn-main">Update password</button>
    </form>
  </div>

  <footer>Existing sessions stay logged in after a password change.</footer>
</div>
</body>
</html>
